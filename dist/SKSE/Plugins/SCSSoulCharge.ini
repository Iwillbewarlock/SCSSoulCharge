; SCSSoulCharge settings (Spellcasting Staff NG add-on)

[General]
; SCS Basic tier keyword given to converted staves: 0 = base staff, 1..5 = +1..+5
iBasicTier=0
; Keep the staff's own name instead of SCS renaming it to the chosen spell
bKeepStaffNames=1
; While a staff's charge cannot pay for its charge spell, hide that spell so the attack does not even start
bSuspendEmptyChargeSpells=1

[Staves]
; Development switch: 1 = convert only the staves listed in sInclude
bOnlyListedStaves=1
; Comma-separated LocalFormID:Plugin entries. 4DED8 = Staff of Ice Spikes (fire-and-forget),
; 4DEE1 = Staff of Frostbite (concentration), both Skyrim.esm
sInclude=4DED8:Skyrim.esm,4DEE1:Skyrim.esm
sExclude=
; Staves with scripts are skipped unless listed in sInclude or this is 1
bIncludeScriptedStaves=0

[SelfTest]
; 1 = write SELFTEST PASS/FAIL lines to SCSSoulCharge.log
bEnabled=1
; Development only: F9 binds the right staff's charge spell, F10/F11 press a right/left attack
bTestControls=0
iTestHoldMs=1500

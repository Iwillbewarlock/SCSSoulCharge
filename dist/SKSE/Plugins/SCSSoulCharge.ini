; SCSSoulCharge settings

[Staves]
; Staves that never take a spell. Comma-separated LocalFormID:Plugin entries, e.g. 4DED8:Skyrim.esm
; Staves with the Spellcasting Staff NG keyword are always left alone.
sExclude=

[Display]
; 1 = while a staff with a bound spell is held, that spell's name ends with a marker in every magic menu list:
; ★R for the staff in the right hand, ★L for the left, both when one spell is on both staves
bStaffMarker=1
; The marker texts (defaults ★R and ★L). Save this file as UTF-16 LE if you change them to non-ASCII characters.
sStaffMarkerRight=
sStaffMarkerLeft=

[Uninstall]
; 1 = on the next load, every bound staff you carry gets its name back and loses its spell, and no new
; spells are taken. Then save, quit and remove the mod. Staves in chests or with followers keep their names.
; Works only on the game version the mod supports (1.6.1170), also when another mod turned it off.
bRestoreNames=0

[SelfTest]
; 1 = write SELFTEST PASS/FAIL/SKIP and per-cast debug lines to SCSSoulCharge.log (testing only)
bEnabled=0
